name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:
    # the release runs the tests first (see release.yml)
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: ${{ matrix.os }}, VS Code ${{ matrix.vscode }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                vscode: [stable]
                include:
                    # the oldest the extension supports: engines.vscode in package.json
                    - os: ubuntu-latest
                      vscode: 1.106.0
        env:
            VSCODE_VERSION: ${{ matrix.vscode }}
        steps:
            - uses: actions/checkout@v5
              with:
                  submodules: recursive

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
                  cache: gradle

            - uses: actions/setup-node@v5
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@v2

            - run: bun install --frozen-lockfile

            - name: Format, lint, types and translations
              run: npm run check

            - name: Backend tests
              run: npm run test:backend

            - name: Backend jar
              run: npm run build:backend

            - name: Unit tests
              run: npm run test:unit

            - name: Protocol test
              run: npm run test:protocol

            # VS Code needs a display; Linux runners have none
            - name: End-to-end tests
              if: runner.os == 'Linux'
              run: xvfb-run -a npm run test:e2e

            - name: End-to-end tests
              if: runner.os != 'Linux'
              run: npm run test:e2e

            - name: Reload test
              if: runner.os == 'Linux'
              run: xvfb-run -a npm run test:reload

            - name: Reload test
              if: runner.os != 'Linux'
              run: npm run test:reload

            - name: Coverage reports
              if: always()
              uses: actions/upload-artifact@v5
              with:
                  name: coverage-${{ matrix.os }}-${{ matrix.vscode }}
                  path: |
                      build/coverage/e2e
                      !build/coverage/e2e/raw
                      backend/build/reports/jacoco/test/html
                  if-no-files-found: ignore
