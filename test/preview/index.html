<!DOCTYPE html>
<!--
	Development preview of the Enigma panes outside VS Code: a stand-in for the webview host with the colours of the
	default dark and light themes, and sample data. Not shipped with the extension.
	Build the pages (bun run bundle, or bun run watch), serve the repository root over HTTP and open /test/preview/index.html?pane=entry&theme=dark&width=320 (add &height=260 for the panel)
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enigma pane preview</title>
    <link rel="stylesheet" href="../../build/extension/dist/codicons/codicon.css">
    <link rel="stylesheet" href="../../build/extension/dist/pages/panes.css">
    <style>
        html { background: #777; }
        body { margin: 0 auto; min-height: 100vh; }
        body.dark {
            --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --vscode-font-size: 13px; --vscode-font-weight: normal;
            --vscode-editor-font-family: Menlo, Monaco, "Courier New", monospace; --vscode-editor-font-size: 12px;
            --vscode-foreground: #cccccc; --vscode-descriptionForeground: #9d9d9d; --vscode-icon-foreground: #cccccc;
            --vscode-sideBar-background: #181818; --vscode-editor-background: #1f1f1f; --vscode-editorWidget-background: #202020;
            --vscode-widget-border: #313131; --vscode-focusBorder: #0078d4;
            --vscode-input-background: #313131; --vscode-input-foreground: #cccccc; --vscode-input-border: #3c3c3c; --vscode-input-placeholderForeground: #989898;
            --vscode-inputValidation-errorBackground: #5a1d1d; --vscode-inputValidation-errorBorder: #be1100;
            --vscode-inputValidation-warningBackground: #352a05; --vscode-inputValidation-warningBorder: #b89500;
            --vscode-button-background: #0078d4; --vscode-button-foreground: #ffffff; --vscode-button-hoverBackground: #026ec1;
            --vscode-button-secondaryBackground: #313131; --vscode-button-secondaryForeground: #cccccc; --vscode-button-secondaryHoverBackground: #3c3c3c;
            --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31); --vscode-list-hoverBackground: #2a2d2e;
            --vscode-inputOption-activeBackground: rgba(36, 137, 219, 0.51); --vscode-inputOption-activeForeground: #ffffff; --vscode-inputOption-activeBorder: #2488db;
            --vscode-badge-background: #616161; --vscode-badge-foreground: #f8f8f8;
            --vscode-textLink-foreground: #4daafc; --vscode-textLink-activeForeground: #4daafc; --vscode-textBlockQuote-background: #2b2b2b;
            --vscode-editorInfo-foreground: #3794ff; --vscode-errorForeground: #f85149; --vscode-testing-iconPassed: #73c991;
            --vscode-keybindingLabel-background: rgba(128,128,128,0.17); --vscode-keybindingLabel-foreground: #cccccc; --vscode-keybindingLabel-border: rgba(51,51,51,0.6); --vscode-keybindingLabel-bottomBorder: rgba(68,68,68,0.6);
            --vscode-tree-indentGuidesStroke: #585858; --vscode-progressBar-background: #0078d4; --vscode-charts-red: #f14c4c;
            --vscode-enigma-obfuscatedBackground: #FF55554D; --vscode-enigma-obfuscatedBorder: #FF555580;
            --vscode-enigma-deobfuscatedBackground: #50FA7B4D; --vscode-enigma-deobfuscatedBorder: #50FA7B80;
            --vscode-enigma-proposedBackground: #6063664D; --vscode-enigma-proposedBorder: #A0A3A680;
            --vscode-enigma-fallbackBackground: #AA55004D; --vscode-enigma-fallbackBorder: #D86F0680;
        }
        body.light {
            --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --vscode-font-size: 13px; --vscode-font-weight: normal;
            --vscode-editor-font-family: Menlo, Monaco, "Courier New", monospace; --vscode-editor-font-size: 12px;
            --vscode-foreground: #3b3b3b; --vscode-descriptionForeground: #717171; --vscode-icon-foreground: #3b3b3b;
            --vscode-sideBar-background: #f8f8f8; --vscode-editor-background: #ffffff; --vscode-editorWidget-background: #f8f8f8;
            --vscode-widget-border: #e5e5e5; --vscode-focusBorder: #005fb8;
            --vscode-input-background: #ffffff; --vscode-input-foreground: #3b3b3b; --vscode-input-border: #cecece; --vscode-input-placeholderForeground: #767676;
            --vscode-inputValidation-errorBackground: #f2dede; --vscode-inputValidation-errorBorder: #be1100;
            --vscode-inputValidation-warningBackground: #f6f5d2; --vscode-inputValidation-warningBorder: #b89500;
            --vscode-button-background: #005fb8; --vscode-button-foreground: #ffffff; --vscode-button-hoverBackground: #0258a8;
            --vscode-button-secondaryBackground: #e5e5e5; --vscode-button-secondaryForeground: #3b3b3b; --vscode-button-secondaryHoverBackground: #cccccc;
            --vscode-toolbar-hoverBackground: rgba(184, 184, 184, 0.31); --vscode-list-hoverBackground: #f2f2f2;
            --vscode-inputOption-activeBackground: rgba(0, 144, 241, 0.2); --vscode-inputOption-activeForeground: #000000; --vscode-inputOption-activeBorder: #005fb8;
            --vscode-badge-background: #cccccc; --vscode-badge-foreground: #3b3b3b;
            --vscode-textLink-foreground: #005fb8; --vscode-textLink-activeForeground: #005fb8; --vscode-textBlockQuote-background: #f2f2f2;
            --vscode-editorInfo-foreground: #1a85ff; --vscode-errorForeground: #f85149; --vscode-testing-iconPassed: #388a34;
            --vscode-keybindingLabel-background: rgba(221,221,221,0.4); --vscode-keybindingLabel-foreground: #3b3b3b; --vscode-keybindingLabel-border: rgba(204,204,204,0.4); --vscode-keybindingLabel-bottomBorder: rgba(187,187,187,0.4);
            --vscode-tree-indentGuidesStroke: #a9a9a9; --vscode-progressBar-background: #005fb8; --vscode-charts-red: #e51400;
            --vscode-enigma-obfuscatedBackground: #FF50503A; --vscode-enigma-obfuscatedBorder: #A05050;
            --vscode-enigma-deobfuscatedBackground: #50C8503A; --vscode-enigma-deobfuscatedBorder: #50A050;
            --vscode-enigma-proposedBackground: #00000027; --vscode-enigma-proposedBorder: #000000BF;
            --vscode-enigma-fallbackBackground: #FFAA4450; --vscode-enigma-fallbackBorder: #D86F06;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script>
    const query = new URLSearchParams(location.search);
    const pane = query.get('pane') || 'entry';
    const scenario = query.get('scenario') || 'default';
    document.body.className = query.get('theme') === 'light' ? 'light' : 'dark';
    document.body.style.background = `var(--vscode-${pane === 'stats' ? 'editor' : 'sideBar'}-background)`;
    if (query.get('width')) {
        document.body.style.width = `${query.get('width')}px`;
    }

    // the panel at the bottom is wide and low
    if (query.get('height')) {
        document.body.style.minHeight = '0';
        document.body.style.height = `${query.get('height')}px`;
        document.body.style.overflow = 'auto';
    }

    window.posted = [];
    const send = message => window.postMessage(message, '*');

    const METHOD = { kind: 'method', owner: 'a', name: 'a', desc: '()V' };
    const SAMPLES = {
        entry: {
            default: [{ type: 'entry', entry: {
                    key: 'm1', kind: 'method', kindLabel: 'Method', icon: 'symbol-method', name: 'doBaseThings', displayName: 'doBaseThings',
                    state: 'deobfuscated', stateLabel: 'Mapped', renamable: true, nameHint: 'Enter to rename. Overrides and all references follow.',
                    documentable: true, javadoc: 'Does the things every base has to do.\n\n@see #getName()',
                    facts: [
                        { label: 'Obfuscated', value: 'a', mono: true, copy: true },
                        { label: 'Declared in', value: 'com.example.BaseClass' },
                        { label: 'Signature', value: '(): void', mono: true },
                        { label: 'Descriptor', value: '()V', mono: true, copy: true },
                    ],
                    toggle: { label: 'Reset to Obfuscated', title: 'Remove this name from the mappings' },
                    actions: [
                        { id: 'declaration', label: 'Declaration', icon: 'go-to-file', title: 'Go to the declaration' },
                        { id: 'inheritance', label: 'Inheritance', icon: 'type-hierarchy-sub', title: 'Show where this is inherited and overridden' },
                        { id: 'implementations', label: 'Implementations', icon: 'symbol-interface', title: 'Show implementations' },
                        { id: 'calls', label: 'Calls', icon: 'call-incoming', title: 'Show what references this' },
                    ],
                } }],
            obfuscated: [{ type: 'entry', entry: {
                    key: 'c1', kind: 'class', kindLabel: 'Class', icon: 'symbol-class', name: 'net/minecraft/class_1234', displayName: 'class_1234',
                    state: 'obfuscated', stateLabel: 'Not mapped', renamable: true, nameHint: 'Use / to separate packages, for example com/example/MyClass.',
                    documentable: true, javadoc: '',
                    facts: [
                        { label: 'Obfuscated', value: 'net/minecraft/class_1234', mono: true, copy: true },
                        { label: 'Extends', value: 'net.minecraft.entity.LivingEntity' },
                        { label: 'Implements', value: 'java.lang.Comparable, net.minecraft.util.Nameable' },
                    ],
                    toggle: { label: 'Mark as Deobfuscated', title: 'Keep the obfuscated name as its name' },
                    actions: [
                        { id: 'declaration', label: 'Declaration', icon: 'go-to-file' },
                        { id: 'inheritance', label: 'Inheritance', icon: 'type-hierarchy-sub' },
                        { id: 'implementations', label: 'Implementations', icon: 'symbol-interface' },
                        { id: 'calls', label: 'Calls', icon: 'call-incoming' },
                    ],
                } }],
            locked: [{ type: 'entry', entry: {
                    key: 's1', kind: 'class', kindLabel: 'Class', icon: 'symbol-class', name: 'java/lang/String', displayName: 'String',
                    state: 'library', stateLabel: 'Library', renamable: false, lockedReason: 'Not part of the jar: it cannot be renamed.',
                    documentable: false, javadoc: '',
                    facts: [{ label: 'Obfuscated', value: 'java/lang/String', mono: true, copy: true }],
                    toggle: null, actions: [],
                } }],
            empty: [{ type: 'entry', entry: null }],
            error: 'error',
        },
        collab: {
            default: [{ type: 'state', state: { projectOpen: true, connection: 'not_connected', users: [], messages: [], defaults: { username: 'dani', address: 'localhost:34712', port: 34712 } } }],
            host: 'host',
            failed: 'failed',
            session: [{ type: 'state', state: {
                    projectOpen: true, connection: 'hosting', port: 34712, self: 'dani', users: ['alex', 'dani', 'sam_the_mapper'], defaults: {},
                    messages: [
                        { type: 'connect', user: 'dani', text: 'dani connected', time: '14:02' },
                        { type: 'connect', user: 'alex', text: 'alex connected', time: '14:03' },
                        { type: 'chat', user: 'alex', text: 'alex: hey, I\'ll take the entity package', body: 'hey, I\'ll take the entity package', time: '14:03' },
                        { type: 'rename', user: 'alex', text: 'alex renamed a.a()V to tick', entry: METHOD, time: '14:04' },
                        { type: 'chat', user: 'dani', text: 'dani: sounds good, I am on world gen', body: 'sounds good, I am on world gen', time: '14:04' },
                        { type: 'edit_docs', user: 'sam_the_mapper', text: 'sam_the_mapper edited the javadoc of net/minecraft/world/World.getChunk(II)Lnet/minecraft/world/chunk/Chunk;', entry: METHOD, time: '14:06' },
                        { type: 'disconnect', user: 'sam_the_mapper', text: 'sam_the_mapper disconnected', time: '14:09' },
                    ],
                } }],
            closed: [{ type: 'state', state: { projectOpen: false, connection: 'not_connected', users: [], messages: [], defaults: {} } }],
        },
        stats: {
            default: [
                { type: 'state', state: { jarName: 'minecraft-1.21.jar', loading: false, options: { types: ['classes', 'methods', 'fields', 'parameters'], package: '', includeSynthetic: false, countFallback: false } } },
                { type: 'result', stats: {
                        mappable: 48210, mapped: 31977, unmapped: 16233,
                        types: {
                            classes: { name: 'Classes', mappable: 7421, mapped: 6950, unmapped: 471 },
                            methods: { name: 'Methods', mappable: 18400, mapped: 13100, unmapped: 5300 },
                            fields: { name: 'Fields', mappable: 9200, mapped: 7800, unmapped: 1400 },
                            parameters: { name: 'Parameters', mappable: 13189, mapped: 4127, unmapped: 9062 },
                        },
                        tree: { name: 'net.minecraft', value: null, children: [
                                { name: 'world', value: null, children: [
                                        { name: 'gen', value: null, children: [{ name: 'ChunkGenerator', value: 412, children: [] }, { name: 'NoiseSampler', value: 230, children: [] }, { name: 'feature', value: null, children: [{ name: 'TreeFeature', value: 88, children: [] }] }] },
                                        { name: 'World', value: 1904, children: [] }, { name: 'ServerWorld', value: 960, children: [] },
                                    ] },
                                { name: 'entity', value: null, children: [{ name: 'LivingEntity', value: 2210, children: [] }, { name: 'Entity', value: 3120, children: [] }, { name: 'mob', value: null, children: [{ name: 'ZombieEntity', value: 301, children: [] }] }] },
                                { name: 'client', value: null, children: [{ name: 'MinecraftClient', value: 4500, children: [] }, { name: 'render', value: null, children: [{ name: 'WorldRenderer', value: 2508, children: [] }] }] },
                            ] },
                    } },
            ],
            done: [
                { type: 'state', state: { jarName: 'tiny.jar', loading: false, options: { types: ['classes'], package: 'com/example', includeSynthetic: false, countFallback: true } } },
                { type: 'result', stats: { mappable: 12, mapped: 12, unmapped: 0, types: { classes: { name: 'Classes', mappable: 12, mapped: 12, unmapped: 0 } }, tree: { name: '', value: null, children: [] } } },
            ],
        },
    };

    window.acquireVsCodeApi = () => ({
        postMessage(message) {
            window.posted.push(message);
            if (message.type !== 'ready') {
                return;
            }

            let sample = SAMPLES[pane][scenario];
            if (sample === 'error' || sample === 'host' || sample === 'failed') {
                SAMPLES[pane].default.forEach(send);
                setTimeout(() => {
                    if (sample === 'error') {
                        const input = document.querySelector('input.mono');
                        input.value = 'class';
                        input.dispatchEvent(new Event('input'));
                        const request = window.posted.filter(m => m.type === 'validate').length + 1;
                        setTimeout(() => send({ type: 'validation', key: 'm1', request: window.posted.filter(m => m.type === 'validate').pop()?.request ?? request, problem: { severity: 'error', message: '\'class\' is a reserved identifier.' } }), 260);
                        const area = document.querySelector('textarea');
                        area.value += '\n@return nothing';
                        area.dispatchEvent(new Event('input'));
                    } else {
                        [...document.querySelectorAll('.segmented button')].find(button => button.textContent === 'Host').click();
                        if (sample === 'failed') {
                            send({ type: 'failed', message: 'Could not start the server on port 34712: Address already in use' });
                        }
                    }
                }, 50);
                return;
            }

            sample.forEach(send);
        },
        getState: () => undefined,
        setState: () => undefined,
    });

    // never show a stale copy while iterating on the design
    for (const link of document.querySelectorAll('link[rel="stylesheet"]')) {
        link.href = `${link.getAttribute('href')}?v=${Date.now()}`;
    }

    // the page as it is built ("bun run watch" keeps it current), with the English texts
    fetch('../../l10n/en.json').then(response => response.json()).then(texts => {
        window.L10N = texts;
        const script = document.createElement('script');
        script.src = `../../build/extension/dist/pages/${pane}.js?v=${Date.now()}`;
        document.body.append(script);
    });
</script>
</body>
</html>
