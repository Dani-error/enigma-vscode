# Logging configuration for the headless backend.
# stdout is reserved for the JSON-RPC stream, so everything goes to stderr; nothing is written to the working directory.
writingthread = false

writerConsole = console
writerConsole.stream = err
writerConsole.format = {date: HH:mm:ss.SSS} [{level}]: {message}
writerConsole.level = info

writerCapture = org.enigmavscode.backend.LogCapture
writerCapture.level = warn
writerCapture.format = {message}
